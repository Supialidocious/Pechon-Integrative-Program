<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Explorer - API Project</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .search-section {
            padding: 40px;
            text-align: center;
        }

        .search-box {
            display: flex;
            gap: 10px;
            max-width: 500px;
            margin: 0 auto 20px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 50px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            min-width: 250px;
        }

        input[type="text"]:focus {
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        .search-btn, .random-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 150px;
        }

        .search-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .random-btn {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            color: #333;
        }

        .search-btn:hover, .random-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #666;
        }

        .error {
            display: none;
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 40px;
            border-left: 5px solid #f66;
        }

        .results {
            display: none;
            padding: 40px;
        }

        .country-card {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .flag {
            width: 100%;
            max-width: 120px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .country-name {
            font-size: 2.2em;
            color: #333;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .info-item {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .info-label {
            font-size: 0.9em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
        }

        @media (max-width: 768px) {
            .search-box {
                flex-direction: column;
            }
            
            input[type="text"] {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 Country Explorer</h1>
            <p>Discover detailed information about any country using public APIs</p>
        </div>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="countryInput" placeholder="Enter country name (e.g., Philippines, Japan, Brazil)">
                <button class="search-btn" onclick="searchCountry()">Search</button>
                <button class="random-btn" onclick="getRandomCountry()">Random</button>
            </div>
            <p style="color: #666; font-size: 0.95em;">
                Try: Philippines, United States, Japan, Brazil, or click Random!
            </p>
        </div>

        <div class="loading" id="loading">
            🔄 Searching for country information...
        </div>

        <div class="error" id="error">
            <strong>❌ Error:</strong> <span id="errorMessage"></span>
        </div>

        <div class="results" id="results">
            <div id="countryCard"></div>
        </div>
    </div>

    <script>
        // API endpoint - Public REST Countries API (no key required)
        const API_BASE = 'https://restcountries.com/v3.1';

        // Search for country by name
        async function searchCountry() {
            const input = document.getElementById('countryInput');
            const countryName = input.value.trim();
            
            if (!countryName) {
                showError('Please enter a country name');
                return;
            }

            showLoading();
            hideError();
            hideResults();

            try {
                // API call with error handling for partial matches
                const response = await fetch(`${API_BASE}/name/${countryName}?fields=name,capital,population,region,flags,subregion,area,tld, currencies, languages`);
                
                if (!response.ok) {
                    throw new Error(`API request failed: ${response.status}`);
                }

                const countries = await response.json();
                
                if (countries.length === 0) {
                    throw new Error('No country found with that name');
                }

                // Use first match (most relevant)
                displayCountry(countries[0]);
                
            } catch (error) {
                showError(error.message);
            } finally {
                hideLoading();
            }
        }

        // Get random country
        async function getRandomCountry() {
            showLoading();
            hideError();
            hideResults();

            try {
                // Get all countries then pick random
                const response = await fetch(`${API_BASE}/all?fields=name,capital,population,region,flags,subregion,area,tld,currencies,languages`);
                const countries = await response.json();
                
                if (countries.length === 0) {
                    throw new Error('No countries available');
                }

                // Pick random country
                const randomCountry = countries[Math.floor(Math.random() * countries.length)];
                displayCountry(randomCountry);
                
            } catch (error) {
                showError('Failed to load random country: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        // Display country information
        function displayCountry(country) {
            const card = document.getElementById('countryCard');
            
            // Format currencies
            const currencies = country.currencies ? 
                Object.values(country.currencies).map(c => c.name).join(', ') : 
                'No data';

            // Format languages
            const languages = country.languages ? 
                Object.values(country.languages).join(', ') : 
                'No data';

            card.innerHTML = `
                <img src="${country.flags.png}" alt="${country.name.common} flag" class="flag" onerror="this.style.display='none'">
                <div class="country-name">${country.name.common}</div>
                
                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-label">Capital</div>
                        <div class="info-value">${country.capital?.[0] || 'No capital'}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Population</div>
                        <div class="info-value">${country.population.toLocaleString()}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Region</div>
                        <div class="info-value">${country.region}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Subregion</div>
                        <div class="info-value">${country.subregion || 'N/A'}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Area</div>
                        <div class="info-value">${country.area?.toLocaleString()} km²</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Currencies</div>
                        <div class="info-value">${currencies}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Languages</div>
                        <div class="info-value">${languages}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Top Level Domain</div>
                        <div class="info-value">${country.tld?.[0] || 'N/A'}</div>
                    </div>
                </div>
            `;

            document.getElementById('results').style.display = 'block';
        }

        // UI Helper Functions
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('error').style.display = 'block';
        }

        function hideError() {
            document.getElementById('error').style.display = 'none';
        }

        function hideResults() {
            document.getElementById('results').style.display = 'none';
        }

        // Enter key support
        document.getElementById('countryInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchCountry();
            }
        });

        // Initialize with example
        document.getElementById('countryInput').value = 'Philippines';
    </script>
</body>
</html>
